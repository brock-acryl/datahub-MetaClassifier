[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-metaclassifier"
version = "0.1.0"
description = "Event-driven metadata classification platform for DataHub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.1",
  "psycopg2-binary>=2.9.10",
  "acryl-datahub-actions"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.3",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "types-requests>=2.32.0"
]

[tool.setuptools]
packages = [
  "services",
  "services.shared",
  "services.event_ingestion_service",
  "services.event_ingestion_service.app",
  "services.classification_service",
  "services.classification_service.app",
  "services.classification_service.app.providers",
  "services.workflow_service",
  "services.workflow_service.app",
  "services.writeback_service",
  "services.writeback_service.app",
  "services.feedback_service",
  "services.feedback_service.app",
  "services.control_api",
  "services.control_api.app"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
strict_optional = true
mypy_path = "."
ignore_missing_imports = true
disable_error_code = ["attr-defined", "valid-type", "misc"]
